[workspace]
authors = ["Ladislav Hovan <ladislav.hovan@ncmbm.uio.no>"]
channels = ["conda-forge", "netzoo", "bioconda"]
name = "analysis_pipeline"
platforms = ["linux-64"]
version = "1.1.0"

[tasks]
snakemake = "snakemake"

[dependencies]
bioconductor-limma = ">=3.62.1,<4"
cupy = ">=13.6.0,<14"  # Only needed for running on GPU
netzoopy = ">=0.10.9,<0.11"
numpy = ">=2.2.0,<2.3"  # netzoopy relies on np.array.tostring() / np.fromstring()
pandas = ">=2.3.3,<3"
python = "==3.13"
"r-data.table" = ">=1.17.8,<2"
snakemake = ">=9.13.7,<10"

[pypi-dependencies]
sisana = { git = "https://github.com/kuijjerlab/sisana.git" }
